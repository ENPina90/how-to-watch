# Periodic jobs, loaded by config/initializers/sidekiq.rb on the Sidekiq server only.
# Times are UTC (config.time_zone is left at Rails' default).

letterboxd_weekly_refresh:
  cron: "0 4 * * 1"   # Mondays at 04:00 UTC
  class: "LetterboxdWeeklyRefreshJob"
  queue: default
  description: "Re-read every linked member's Letterboxd diary and add what is new."

source_expiry_scan:
  cron: "30 5 * * *"   # daily at 05:30 UTC
  class: "SourceExpiryScanJob"
  queue: default
  description: "Warn admins about provider domains that are close to lapsing, or have."

close_abandoned_watch_parties:
  cron: "*/15 * * * *"   # every 15 minutes
  class: "CloseAbandonedWatchPartiesJob"
  queue: default
  description: "Close watch parties nobody has had open for a while."

broken_poster_scan:
  cron: "0 6 * * 1"   # Mondays at 06:00 UTC
  class: "BrokenPosterScanJob"
  queue: default
  description: "Ask every entry's poster URL whether the image is still there, and tell admins about the ones that are not."

embed_availability_scan:
  cron: "0 6 * * 2"   # Tuesdays at 06:00 UTC
  class: "EmbedAvailabilityScanJob"
  queue: default
  description: "Ask VidSrc which entries it actually holds a file for, and tell admins about the ones it does not."

# 07:00 America/Toronto. Fixed in UTC, so through the winter it fires at 06:00 local
# instead -- an hour either side makes no difference to a job that lays out a day that has
# not started yet.
cable_schedule:
  cron: "0 11 * * *"   # daily at 11:00 UTC
  class: "CableScheduleJob"
  queue: default
  description: "Lay out tomorrow's programme for every cable channel, and fill today's if it is empty."

missing_runtime_scan:
  cron: "0 6 * * 3"   # Wednesdays at 06:00 UTC
  class: "MissingRuntimeScanJob"
  queue: default
  description: "Find the scheduled entries cable has to guess a runtime for, and tell admins about them."
