development:
  # Action Cable in development runs inside the one Puma process, so the in-process
  # adapter needs nothing installed and nothing kept running. Development does not
  # otherwise need Redis at all -- Active Job is :async here. Set REDIS_URL to exercise
  # the production path instead.
  adapter: <%= ENV["REDIS_URL"].present? ? "redis" : "async" %>
  url: <%= ENV["REDIS_URL"] %>

test:
  adapter: test

production:
  adapter: redis
  url: <%= ENV.fetch("REDIS_URL") { "redis://localhost:6379/1" } %>
  channel_prefix: how_to_watch_production
